<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF7F4;--card:#FFF;--pri:#E85D3A;--text:#2D2018;--text2:#8C7B6B;--brd:#EDE8E2;--grn:#2E7D32;--gbg:#E8F5E9;--org:#E65100;--obg:#FFF3E0;--blu:#1565C0;--yel:#F9A825;--sans:'DM Sans',-apple-system,sans-serif;--serif:'DM Serif Display',Georgia,serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
"use strict";
var h=React.createElement,F=React.Fragment,us=React.useState,ue=React.useEffect,uc=React.useCallback,ur=React.useRef,um=React.useMemo,cc=React.createContext,ux=React.useContext;

/* ===== DB ===== */
var DB_N='RecipeBook5',DB_V=1;
function odb(){return new Promise(function(ok,no){var r=indexedDB.open(DB_N,DB_V);r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains('genres'))d.createObjectStore('genres',{keyPath:'id'});if(!d.objectStoreNames.contains('recipes'))d.createObjectStore('recipes',{keyPath:'id'});if(!d.objectStoreNames.contains('diary')){var s=d.createObjectStore('diary',{keyPath:'id'});s.createIndex('recipeId','recipeId',{unique:false})}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'id'})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
function dAll(s){return odb().then(function(db){return new Promise(function(ok,no){var t=db.transaction(s,'readonly'),r=t.objectStore(s).getAll();r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})})}
function dPut(s,i){return odb().then(function(db){return new Promise(function(ok,no){var t=db.transaction(s,'readwrite');t.objectStore(s).put(i);t.oncomplete=function(){ok()};t.onerror=function(){no(t.error)}})})}
function dDel(s,id){return odb().then(function(db){return new Promise(function(ok,no){var t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=function(){ok()};t.onerror=function(){no(t.error)}})})}
function dIdx(s,idx,val){return odb().then(function(db){return new Promise(function(ok,no){var t=db.transaction(s,'readonly'),r=t.objectStore(s).index(idx).getAll(val);r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})})}

/* ===== UTILS ===== */
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
function ytId(u){if(!u)return null;var m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);return m?m[1]:null}
function ytT(u){var id=ytId(u);return id?'https://img.youtube.com/vi/'+id+'/hqdefault.jpg':null}
function f2d(f){return new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(r.result)};r.readAsDataURL(f)})}
function fmtDate(ts){var d=new Date(ts);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function parseAmt(s){if(!s)return null;s=s.trim();var fracs={'\u00BD':0.5,'\u00BC':0.25,'\u00BE':0.75,'\u2153':0.333,'\u2154':0.667};if(fracs[s])return fracs[s];var n=parseFloat(s);return isNaN(n)?null:n}
function fmtAmt(n){if(n==null)return'';if(n===Math.floor(n))return''+n;return n%1>0.01?n.toFixed(1).replace(/\.0$/,''):''+Math.round(n)}
// Resize image to max 1600px wide, return data URL
function resizeImg(dataUrl,maxW){
  return new Promise(function(ok){
    if(!dataUrl||!dataUrl.startsWith('data:image'))return ok(dataUrl);
    var img=new Image();img.onload=function(){
      if(img.width<=maxW)return ok(dataUrl);
      var ratio=maxW/img.width;var c=document.createElement('canvas');
      c.width=maxW;c.height=Math.round(img.height*ratio);
      var ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
      ok(c.toDataURL('image/jpeg',0.85));
    };img.onerror=function(){ok(dataUrl)};img.src=dataUrl;
  });
}

/* ===== API KEY ===== */
async function getApiKey(){try{var db=await odb();return new Promise(function(ok){var t=db.transaction('settings','readonly');var r=t.objectStore('settings').get('anthropic_key');r.onsuccess=function(){ok(r.result?r.result.value:null)};r.onerror=function(){ok(null)}})}catch(e){return null}}
async function setApiKey(key){var db=await odb();return new Promise(function(ok,no){var t=db.transaction('settings','readwrite');t.objectStore('settings').put({id:'anthropic_key',value:key});t.oncomplete=function(){ok()};t.onerror=function(){no(t.error)}})}

/* ===== SUPABASE CONFIG ===== */
async function getSupaCfg(){try{var db=await odb();return new Promise(function(ok){var t=db.transaction('settings','readonly');var r=t.objectStore('settings').get('supabase_cfg');r.onsuccess=function(){ok(r.result?r.result.value:null)};r.onerror=function(){ok(null)}})}catch(e){return null}}
async function setSupaCfg(cfg){var db=await odb();return new Promise(function(ok,no){var t=db.transaction('settings','readwrite');t.objectStore('settings').put({id:'supabase_cfg',value:cfg});t.oncomplete=function(){ok()};t.onerror=function(){no(t.error)}})}

/* ===== SUPABASE SYNC ENGINE ===== */
var SB={cfg:null,ready:false};
async function sbInit(){
  var cfg=await getSupaCfg();
  if(!cfg||!cfg.url||!cfg.key){SB.ready=false;return false}
  SB.cfg=cfg;SB.ready=true;return true;
}
function sbHeaders(){return{'Content-Type':'application/json','apikey':SB.cfg.key,'Authorization':'Bearer '+SB.cfg.key,'Prefer':'return=representation'}}
function sbUrl(table,query){return SB.cfg.url+'/rest/v1/'+table+(query||'')}
function sbStorageUrl(path){return SB.cfg.url+'/storage/v1/object/images/'+path}
// Generic upsert (insert or update)
async function sbUpsert(table,rows){
  if(!SB.ready||!rows.length)return;
  try{var r=await fetch(sbUrl(table),{method:'POST',headers:Object.assign({},sbHeaders(),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify(rows)});if(!r.ok){var t=await r.text();console.log('sbUpsert err',table,r.status,t)}}catch(e){console.log('sbUpsert fail',table,e)}
}
async function sbFetchAll(table){
  if(!SB.ready)return[];
  try{var r=await fetch(sbUrl(table,'?select=*'),{headers:sbHeaders()});if(r.ok)return await r.json();var t=await r.text();console.log('sbFetch err',table,r.status,t);return[]}catch(e){console.log('sbFetch fail',table,e);return[]}
}
async function sbDelete(table,id){
  if(!SB.ready)return;
  try{await fetch(sbUrl(table,'?id=eq.'+id),{method:'DELETE',headers:sbHeaders()})}catch(e){console.log('sbDel fail',table,e)}
}
// Upload image to Supabase Storage — deterministic name, skip if already uploaded
async function sbUploadImg(name,dataUrl){
  if(!SB.ready||!dataUrl)return null;
  // If it's already a Supabase URL, skip
  if(dataUrl.indexOf(SB.cfg.url)!==-1)return dataUrl;
  // Handle base64 data URLs
  if(dataUrl.startsWith('data:')){
    try{
      var resized=await resizeImg(dataUrl,1600);
      var b64=resized.split(',')[1];var mt=resized.match(/data:(.*?);/)[1];
      var bytes=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
      var r=await fetch(SB.cfg.url+'/storage/v1/object/images/'+name,{method:'POST',headers:{'apikey':SB.cfg.key,'Authorization':'Bearer '+SB.cfg.key,'Content-Type':mt,'x-upsert':'true'},body:bytes});
      if(r.ok||r.status===200){return SB.cfg.url+'/storage/v1/object/public/images/'+name}
      console.log('upload fail',r.status,await r.text());return null;
    }catch(e){console.log('upload err',e);return null}
  }
  // Handle external URLs (e.g. YouTube thumbnails) — download and re-upload
  if(dataUrl.startsWith('http')){
    try{
      var resp=await fetch(dataUrl);if(!resp.ok)return null;
      var blob=await resp.blob();
      var r=await fetch(SB.cfg.url+'/storage/v1/object/images/'+name,{method:'POST',headers:{'apikey':SB.cfg.key,'Authorization':'Bearer '+SB.cfg.key,'Content-Type':blob.type||'image/jpeg','x-upsert':'true'},body:blob});
      if(r.ok||r.status===200){return SB.cfg.url+'/storage/v1/object/public/images/'+name}
      console.log('upload ext fail',r.status,await r.text());return null;
    }catch(e){console.log('upload ext err',e);return null}
  }
  return null;
}
// Full sync: push local changes, pull remote changes
async function sbSync(localGenres,localRecipes){
  if(!SB.ready)return{genres:localGenres,recipes:localRecipes,changed:false};
  try{
    // Fetch remote
    var remG=await sbFetchAll('genres');var remR=await sbFetchAll('recipes');
    var remD=await sbFetchAll('diary');
    // Build lookup maps
    var lgMap={};localGenres.forEach(function(g){lgMap[g.id]=g});
    var lrMap={};localRecipes.forEach(function(r){lrMap[r.id]=r});
    var rgMap={};remG.forEach(function(g){rgMap[g.id]=g});
    var rrMap={};remR.forEach(function(r){rrMap[r.id]=r});
    var changed=false;
    // Merge genres: newest wins
    var allGIds={};localGenres.forEach(function(g){allGIds[g.id]=true});remG.forEach(function(g){allGIds[g.id]=true});
    var mergedG=[];var pushG=[];
    Object.keys(allGIds).forEach(function(id){
      var l=lgMap[id],r=rgMap[id];
      if(l&&!r){pushG.push(l);mergedG.push(l)}
      else if(!l&&r){mergedG.push(r);changed=true}
      else{var pick=(l.updatedAt||l.createdAt||0)>=(r.updated_at||r.updatedAt||r.createdAt||0)?l:r;mergedG.push(pick);if(pick===l)pushG.push(l);else changed=true}
    });
    // Merge recipes: newest wins, handle images
    var allRIds={};localRecipes.forEach(function(r){allRIds[r.id]=true});remR.forEach(function(r){allRIds[r.id]=true});
    var mergedR=[];var pushR=[];
    Object.keys(allRIds).forEach(function(id){
      var l=lrMap[id],r=rrMap[id];
      if(l&&!r){pushR.push(l);mergedR.push(l)}
      else if(!l&&r){mergedR.push(r);changed=true}
      else{var lt=l.updatedAt||0,rt=r.updated_at||r.updatedAt||0;var pick=lt>=rt?l:r;mergedR.push(pick);if(pick===l)pushR.push(l);else changed=true}
    });
    // Merge diary
    var localDiary=await dAll('diary');var ldMap={};localDiary.forEach(function(d){ldMap[d.id]=d});
    var rdMap={};remD.forEach(function(d){rdMap[d.id]=d});
    var allDIds={};localDiary.forEach(function(d){allDIds[d.id]=true});remD.forEach(function(d){allDIds[d.id]=true});
    var pushD=[];
    Object.keys(allDIds).forEach(function(id){
      var l=ldMap[id],r=rdMap[id];
      if(l&&!r){pushD.push(l)}
      else if(!l&&r){dPut('diary',r);changed=true}
      else{var lt=l.createdAt||0,rt=r.created_at||r.createdAt||0;if(lt>=rt)pushD.push(l);else{dPut('diary',r);changed=true}}
    });
    // Push to Supabase (strip base64 images for cloud, store URLs)
    if(pushG.length){
      var rows=pushG.map(function(g){return{id:g.id,name:g.name,emoji:g.emoji||null,created_at:g.createdAt||Date.now(),updated_at:g.updatedAt||g.createdAt||Date.now()}});
      await sbUpsert('genres',rows);
    }
    if(pushR.length){
      for(var i=0;i<pushR.length;i++){
        var rec=pushR[i];
        // Upload images to storage, replace base64 with URLs
        var cloudImgs=[];
        var localImgs=rec.images||[];
        for(var j=0;j<localImgs.length;j++){
          var im=localImgs[j];
          if(im&&im.indexOf(SB.cfg.url)!==-1){cloudImgs.push(im);continue}
          if(im&&(im.startsWith('data:')||im.startsWith('http'))){
            var imgName=rec.id+'_img'+j+'.jpg';
            var url=await sbUploadImg(imgName,im);
            if(url){cloudImgs.push(url);localImgs[j]=url}
            else cloudImgs.push(im);
          }else{cloudImgs.push(im)}
        }
        // Update local with cloud URLs
        if(localImgs!==rec.images||cloudImgs.some(function(u,i){return u!==rec.images[i]})){rec.images=localImgs;await dPut('recipes',rec)}
        // Upload diary images too
        var diaryForRec=pushD.filter(function(d){return d.recipeId===rec.id});
        for(var k=0;k<diaryForRec.length;k++){
          var de=diaryForRec[k];
          if(de.image&&de.image.startsWith('data:')){
            var dn='diary_'+de.id+'.jpg';
            var du=await sbUploadImg(dn,de.image);
            if(du){de.cloudImage=du;de.image=du;await dPut('diary',de)}
          }else if(de.image&&de.image.indexOf(SB.cfg.url)!==-1){de.cloudImage=de.image}
        }
        var row={id:rec.id,name:rec.name,genre_ids:rGids(rec),images:cloudImgs,youtube_url:rec.youtubeUrl||null,website_url:rec.websiteUrl||null,instructions:rec.instructions||[],calories:rec.calories,protein:rec.protein,carbs:rec.carbs,fat:rec.fat,servings:rec.servings||1,ingredients:rec.ingredients||[],cover_index:rec.coverIndex||0,hidden:rec.hidden||false,rating:rec.rating||0,created_at:rec.createdAt||Date.now(),updated_at:rec.updatedAt||Date.now()};
        await sbUpsert('recipes',[row]);
      }
    }
    if(pushD.length){
      var dRows=pushD.map(function(d){return{id:d.id,recipe_id:d.recipeId,date:d.date,comment:d.comment||null,image:d.cloudImage||null,scan:d.scan||null,created_at:d.createdAt||Date.now()}});
      await sbUpsert('diary',dRows);
    }
    // Write merged remote data to local
    if(changed){
      for(var i=0;i<mergedG.length;i++){
        if(!lgMap[mergedG[i].id])await dPut('genres',mergedG[i]);
      }
      for(var i=0;i<mergedR.length;i++){
        if(!lrMap[mergedR[i].id]){
          // Convert remote format to local format
          var rr=mergedR[i];
          var local={id:rr.id,name:rr.name,genreIds:rr.genre_ids||rGids(rr),images:rr.images||[],youtubeUrl:rr.youtube_url||rr.youtubeUrl||null,websiteUrl:rr.website_url||rr.websiteUrl||null,instructions:rr.instructions||[],calories:rr.calories,protein:rr.protein,carbs:rr.carbs,fat:rr.fat,servings:rr.servings||1,ingredients:rr.ingredients||[],coverIndex:rr.cover_index!=null?rr.cover_index:(rr.coverIndex||0),hidden:rr.hidden||false,rating:rr.rating||0,createdAt:rr.created_at||rr.createdAt||Date.now(),updatedAt:rr.updated_at||rr.updatedAt||Date.now()};
          await dPut('recipes',local);
          mergedR[i]=local;
        }
      }
    }
    return{genres:mergedG,recipes:mergedR,changed:changed};
  }catch(e){console.log('Sync error',e);return{genres:localGenres,recipes:localRecipes,changed:false}}
}
// Push single item after local save
async function sbPushGenre(g){
  if(!SB.ready)return;
  sbUpsert('genres',[{id:g.id,name:g.name,emoji:g.emoji||null,created_at:g.createdAt||Date.now(),updated_at:g.updatedAt||g.createdAt||Date.now()}]);
}
async function sbPushRecipe(rec){
  if(!SB.ready)return;
  var cloudImgs=[];var li=rec.images||[];var localChanged=false;
  for(var j=0;j<li.length;j++){
    var im=li[j];
    // Already a Supabase URL — keep as-is
    if(im&&im.indexOf(SB.cfg.url)!==-1){cloudImgs.push(im);continue}
    // Needs upload (base64 or external URL like YouTube thumb)
    if(im&&(im.startsWith('data:')||im.startsWith('http'))){
      var n=rec.id+'_img'+j+'.jpg';
      var u=await sbUploadImg(n,im);
      if(u){cloudImgs.push(u);li[j]=u;localChanged=true}
      else cloudImgs.push(im);
    }else{cloudImgs.push(im)}
  }
  // Write cloud URLs back to local DB so we don't re-upload next time
  if(localChanged){rec.images=li;await dPut('recipes',rec)}
  sbUpsert('recipes',[{id:rec.id,name:rec.name,genre_ids:rGids(rec),images:cloudImgs,youtube_url:rec.youtubeUrl||null,website_url:rec.websiteUrl||null,instructions:rec.instructions||[],calories:rec.calories,protein:rec.protein,carbs:rec.carbs,fat:rec.fat,servings:rec.servings||1,ingredients:rec.ingredients||[],cover_index:rec.coverIndex||0,hidden:rec.hidden||false,rating:rec.rating||0,created_at:rec.createdAt||Date.now(),updated_at:rec.updatedAt||Date.now()}]);
}
async function sbPushDiary(d){
  if(!SB.ready)return;
  var ci=null;
  if(d.image&&d.image.indexOf(SB.cfg.url)!==-1){ci=d.image}
  else if(d.image&&d.image.startsWith('data:')){
    var n='diary_'+d.id+'.jpg';ci=await sbUploadImg(n,d.image);
    if(ci){d.image=ci;await dPut('diary',d)}
  }
  sbUpsert('diary',[{id:d.id,recipe_id:d.recipeId,date:d.date,comment:d.comment||null,image:ci||null,scan:d.scan||null,created_at:d.createdAt||Date.now()}]);
}
async function sbDeleteGenre(id){sbDelete('genres',id)}
async function sbDeleteRecipe(id){sbDelete('recipes',id)}
async function sbDeleteDiary(id){sbDelete('diary',id)}
</script>
<script>
/* ===== YT EXTRACTION ===== */
async function fetchYT(url,cb){
  var vid=ytId(url);if(!vid)return{error:'Invalid YouTube URL'};
  var thumb='https://img.youtube.com/vi/'+vid+'/hqdefault.jpg';
  if(cb)cb('Fetching video info...');
  var title=null;
  try{var r=await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+vid);if(r.ok){var d=await r.json();title=d.title}}catch(e){}
  if(!title)try{var r2=await fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+vid+'&format=json');if(r2.ok){var d2=await r2.json();title=d2.title}}catch(e){}
  var apiKey=await getApiKey();
  if(!apiKey){if(cb)cb('Got title & thumbnail');return{name:title||'Recipe',servings:4,ingredients:[],instructions:[],calories:null,protein:null,carbs:null,fat:null,thumbnail:thumb,mode:'basic'}}
  // Step 1: Try transcript
  if(cb)cb('Fetching transcript...');
  var transcript=null;
  try{var tr=await fetch('https://corsproxy.io/?url='+encodeURIComponent('https://yt.lemnoslife.com/videos?part=transcript&id='+vid));if(tr.ok){var td=await tr.json();if(td.items&&td.items[0]&&td.items[0].transcript){var segs=td.items[0].transcript;if(segs.length>0)transcript=segs.map(function(s){return s.text||''}).join(' ').substring(0,4000)}}}catch(e){console.log('transcript fetch err',e)}
  // Step 2: If no transcript, try description
  var description=null;
  if(!transcript){
    if(cb)cb('No transcript, trying description...');
    try{var dr=await fetch('https://corsproxy.io/?url='+encodeURIComponent('https://yt.lemnoslife.com/videos?part=snippet&id='+vid));if(dr.ok){var dd=await dr.json();if(dd.items&&dd.items[0]&&dd.items[0].snippet&&dd.items[0].snippet.description){var desc=dd.items[0].snippet.description;if(desc.length>20)description=desc.substring(0,4000)}}}catch(e){console.log('description fetch err',e)}
  }
  // Step 3: If we have either, send to AI
  var source=transcript||description;
  if(source){
    if(cb)cb('AI extracting recipe...');
    var ctx='Title: "'+(title||'Unknown')+'"\n'+(transcript?'Video transcript:\n':'Video description:\n')+source+'\n\nExtract the recipe from the above content. Return ONLY JSON:\n{"name":"...","servings":4,"ingredients":[{"amount":"100","unit":"g","name":"flour"}],"instructions":["Step 1"],"calories":400,"protein":25,"carbs":50,"fat":15}\nMetric only. Nutrition per serving integers or null.';
    try{
      var resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:ctx}]})});
      if(resp.ok){var data=await resp.json();var txt=data.content.map(function(b){return b.text||''}).join('');var p=JSON.parse(txt.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim());return{name:p.name||title,servings:p.servings||4,ingredients:p.ingredients||[],instructions:p.instructions||[],calories:p.calories,protein:p.protein,carbs:p.carbs,fat:p.fat,thumbnail:thumb,mode:'ai'}}
      else{var et=await resp.text();console.log('API:',resp.status,et)}
    }catch(e){console.log('AI fail',e)}
  }
