/* ===== YT EXTRACTION ===== */
async function fetchYT(url,cb){

  var ctx='Title: "'+(title||'Unknown')+'"\n'+(transcript?'Transcript:\n'+transcript+'\n':'Provide standard recipe.\n');
  try{
    var resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:ctx+'\nReturn ONLY JSON:\n{"name":"...","servings":4,"ingredients":[{"amount":"100","unit":"g","name":"flour"}],"instructions":["Step 1"],"calories":400,"protein":25,"carbs":50,"fat":15}\nMetric only. Nutrition per serving integers or null.'}]})});
    if(resp.ok){var data=await resp.json();var txt=data.content.map(function(b){return b.text||''}).join('');var p=JSON.parse(txt.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim());return{name:p.name||title,servings:p.servings||4,ingredients:p.ingredients||[],instructions:p.instructions||[],calories:p.calories,protein:p.protein,carbs:p.carbs,fat:p.fat,thumbnail:thumb,mode:'ai'}}

  }catch(e){console.log('AI fail',e)}
  return{name:title||'Recipe',servings:4,ingredients:[],instructions:[],calories:null,protein:null,carbs:null,fat:null,thumbnail:thumb,mode:'basic'};
}

/* ===== WEBSITE EXTRACTION ===== */
async function fetchWebsite(url,cb){
  var apiKey=await getApiKey();
  if(!apiKey)return{error:'Add API key in Settings to extract from websites'};
  if(cb)cb('Fetching page...');
  var pageText='';
  try{
    var resp=await fetch('https://corsproxy.io/?url='+encodeURIComponent(url));
    if(resp.ok){
      var html=await resp.text();
      // Extract title
      var tm=html.match(/<title[^>]*>([^<]*)<\/title>/i);
      var title=tm?tm[1].trim():'';
      // Extract og:image for thumbnail
      var ogm=html.match(/<meta[^>]*property=["']og:image["'][^>]*content=["']([^"']+)["']/i);
      if(!ogm)ogm=html.match(/<meta[^>]*content=["']([^"']+)["'][^>]*property=["']og:image["']/i);
      var ogImg=ogm?ogm[1]:null;
      // Strip tags for text content
      var text=html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      pageText=text.substring(0,5000);
      if(cb)cb('AI extracting recipe...');
      try{
        var prompt='Website title: "'+title+'"\nPage content:\n'+pageText+'\n\nExtract the recipe from this webpage. Return ONLY valid JSON:\n{"name":"...","servings":4,"ingredients":[{"amount":"100","unit":"g","name":"flour"}],"instructions":["Step 1"],"calories":400,"protein":25,"carbs":50,"fat":15}\nMetric units (g,kg,ml,L). amount=string. Nutrition per serving as integers or null.';
        var ar=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,messages:[{role:'user',content:prompt}]})});
        if(ar.ok){var data=await ar.json();var txt=data.content.map(function(b){return b.text||''}).join('');var p=JSON.parse(txt.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim());return{name:p.name||title,servings:p.servings||4,ingredients:p.ingredients||[],instructions:p.instructions||[],calories:p.calories,protein:p.protein,carbs:p.carbs,fat:p.fat,thumbnail:ogImg,mode:'ai'}}
        else{var et=await ar.text();console.log('API:',ar.status,et);return{name:title,thumbnail:ogImg,ingredients:[],instructions:[],mode:'basic'}}
      }catch(e){console.log('AI fail',e);return{name:title,thumbnail:ogImg,ingredients:[],instructions:[],mode:'basic'}}
    }else return{error:'Could not fetch page ('+resp.status+')'}
  }catch(e){return{error:'Could not access website: '+e.message}}
}
